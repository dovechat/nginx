server {
    listen 8443 ssl;
    listen 443 ssl;
    server_name tg.dove-chat.com;
    # ssl_certificate /etc/nginx/ssl/fullchain-1771941018.pem;
    # ssl_certificate_key /etc/nginx/ssl/privkey-1771941018.pem;

    ssl_certificate /etc/nginx/ssl/tg.dove-chat.com/fullchain-1778287861.pem;
    ssl_certificate_key /etc/nginx/ssl/tg.dove-chat.com/privkey-1778287861.pem;



    location = /openapi.json {
        set $target_port 30084;
        if ($http_referer ~* /api/docs)  { set $target_port 30084; }
        if ($http_referer ~* /auth/docs) { set $target_port 30085; }
        if ($http_referer ~* /chat/docs) { set $target_port 30086; }
        proxy_pass http://127.0.0.1:$target_port;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /chat {
        rewrite ^/chat/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:30080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;
    }
    location /chat/assets/ {
        proxy_pass http://127.0.0.1:30080/assets/;
    }

    location /lk/assets/ {
        proxy_pass http://127.0.0.1:30081/assets/;
    }
    location /lk/ {
        proxy_pass http://127.0.0.1:30081;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:30084;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:30084/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 8443;
        proxy_set_header X-Forwarded-Prefix /api;
        proxy_redirect off;
        proxy_buffering off;
    }

    location /account/ {
        proxy_pass http://127.0.0.1:30082/;
        proxy_set_header Host $host;
    }

    location /tg/ {
        proxy_pass http://127.0.0.1:30083/;
    }

    location /adminbe/ {
        proxy_pass http://127.0.0.1:30085/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Prefix /adminbe;
    }

    location /panel/ {
        proxy_pass http://127.0.0.1:30089;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /panel/assets/ {
        proxy_pass http://127.0.0.1:30089/assets/;
    }

    location /minio/ {
        proxy_pass http://127.0.0.1:31001/;
        proxy_set_header X-Forwarded-Prefix /minio;
    }
    location /storage/ {
        proxy_pass http://127.0.0.1:31000/dovechat-media/;
    }

    location /grafana/ {
        proxy_pass http://127.0.0.1:31005/grafana/;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Host $host;
    }

    location /login {
        proxy_pass http://127.0.0.1:30087;
        proxy_set_header Host $host;
    }
    location /chats/ {
        proxy_pass http://127.0.0.1:30087;
        proxy_set_header Host $host;
    }
    location /admin/ {
        proxy_pass http://127.0.0.1:30087;
        proxy_set_header Host $host;
    }
    location /adm/ {
        proxy_pass http://127.0.0.1:30087;
        proxy_set_header Host $host;
    }
    location / {
        proxy_pass http://127.0.0.1:30087;
        proxy_set_header Host $host;
    }
    location /lc/ {
        proxy_pass http://127.0.0.1:30087;
        proxy_set_header Host $host;
    }
    location /af/ {
	proxy_pass http://127.0.0.1:31006;
	proxy_set_header Host $http_host;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_set_header X-Forwarded-Prefix /af;
	proxy_redirect off;
	proxy_http_version 1.1;
    }
    location /crm/ {
        proxy_pass http://127.0.0.1:30088/;
        proxy_set_header Host $host;
    }
    
    
}